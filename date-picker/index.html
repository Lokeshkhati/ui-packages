<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        max-width: 250px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      input {
        width: 100%;
        padding: 6px;
      }
      .datepicker {
        background-color: white;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-radius: 4px;
      }
      .datepicker-nav {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }
      .weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 8px;
        font-size: 16px;
      }
      button {
        cursor: pointer;
      }
      .day-cell {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .current-month-cell{
        cursor: pointer;
      }
      .days-container {
        width: 100%;
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(7, 1fr);
      }
      .datepicker-footer {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }
      .selected {
        background: black;
        color: white;
        border-radius: 50%;
      }
      .other-month{
        color: gray;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input
        type="text"
        class="date-input"
        placeholder="Select a date..."
        readonly
      />
      <div class="datepicker">
        <div class="datepicker-nav">
          <div>
            <button class="datepicker-prev-year" title="Previous Year">
              «
            </button>
            <button class="datepicker-prev-month" title="Previous Month">
              ‹
            </button>
          </div>
          <span class="datepicker-title">Jan 2026</span>
          <div>
            <button class="datepicker-next-month" title="Next Month">›</button>
            <button class="datepicker-next-year" title="Next Year">»</button>
          </div>
        </div>
        <div class="'datepicker-calender">
          <div class="weekdays">
            <div>Su</div>
            <div>Mo</div>
            <div>Tu</div>
            <div>We</div>
            <div>Th</div>
            <div>Fr</div>
            <div>Sa</div>
          </div>
          <div class="days-container">
            <!-- Days will be generated by JavaScript -->
          </div>
        </div>
        <!-- footer -->
        <div class="datepicker-footer">
          <button class="datepicker-today-btn">Today</button>
          <button class="datepicker-clear-btn">Clear</button>
        </div>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
